stages:
  - build
  - docker
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - when: never

build:
  image: node:20.19.3-alpine3.22
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - node_modules/
      - dist/
    expire_in: 30 mins

docker:
  # Use the official docker image.
  image: docker:cli
  stage: docker
  services:
    - docker:dind
  # variables:
  #   DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_PIPELINE_IID
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - DOCKER_IMAGE_NAME="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
  script:
    - echo $DOCKER_IMAGE_NAME
    - docker build --pull -t "$DOCKER_IMAGE_NAME" .
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:$VERSION"
        docker push "$CI_REGISTRY_IMAGE:$VERSION"

        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      else
        docker push "$DOCKER_IMAGE_NAME"
      fi
    - echo "DOCKER_IMAGE_NAME=$DOCKER_IMAGE_NAME" >> environment.env
  artifacts:
    reports:
      dotenv: environment.env

deploy:
  stage: deploy
  image: registry.unir.br/cirs/ansible
  variables:
    ANSIBLE_PATH: ansible
  before_script:
    - |
      # Define a variável de versão
      VERSION=$CI_COMMIT_TAG

      # Extrai o ambiente da string da versão
      # Use 'awk' para pegar a parte da string após o último hífen
      ENVIRONMENT=$(echo "$VERSION" | awk -F'-' '{print $2}')

      # Verifica se o ambiente foi extraído com sucesso.
      # Se a string não contiver um hífen, assume-se que é PROD.
      if [ -z "$ENVIRONMENT" ]; then
          ENVIRONMENT="PROD"
      else
          # Converte o nome do ambiente para maiúsculas (ex: staging -> STAGING)
          ENVIRONMENT=$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
      fi

      # Monta o nome da variável dinamicamente
      VAR_NAME="${ENVIRONMENT}_ANSIBLE_HOST"
      APP_URL_NAME="${ENVIRONMENT}_APP_URL"
      PROJECT_ENV_NAME="${ENVIRONMENT}_PROJECT_ENV"
      ANSIBLE_SSH_PRIVATE_KEY_NAME="${ENVIRONMENT}_ANSIBLE_SSH_PRIVATE_KEY"
      ANSIBLE_SSH_PUBLIC_KEY_NAME="${ENVIRONMENT}_ANSIBLE_SSH_PUBLIC_KEY"

      # Usa indireção para pegar o valor
      export HOST="${!VAR_NAME}"
      export APP_URL="${!APP_URL_NAME}"
      export PROJECT_ENV="${!PROJECT_ENV_NAME}"
      export ANSIBLE_SSH_PRIVATE_KEY="${!ANSIBLE_SSH_PRIVATE_KEY_NAME}"
      export ANSIBLE_SSH_PUBLIC_KEY="${!ANSIBLE_SSH_PUBLIC_KEY_NAME}"
    - printenv
    - |
      if [ ! -d "$ANSIBLE_PATH" ]; then
        echo "📁 Pasta $ANSIBLE_PATH] não existe — job ignorado."
        exit 0
      fi
    - mkdir -p ~/.ssh
    - cp $ANSIBLE_SSH_PRIVATE_KEY ~/.ssh/id_ed25519
    - cp $ANSIBLE_SSH_PUBLIC_KEY ~/.ssh/id_ed25519.pub
    - chmod 700 ~/.ssh
    - chmod 600 ~/.ssh/id_ed25519
    - cp -r $ANSIBLE_PATH/. .
    - ssh-keyscan -t ed25519,rsa "$HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

  script:
    - cp $PROJECT_ENV ./.env.production
    - ansible-galaxy collection install -r requirements.yml
    - ansible-playbook -i "$HOST," -u "ansible" playbook.yaml
